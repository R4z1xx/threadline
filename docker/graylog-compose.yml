# threadline :: Graylog stack
# Env vars are populated into .env by lib/core_bootstrap.sh (bootstrap_core).
# Do not edit passwords/secrets here — edit .env instead.

services:
  mongodb:
    image: mongo:6.0
    container_name: soc-mongodb
    restart: unless-stopped
    networks: [threadline]
    volumes:
      - mongodb_data:/data/db

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: soc-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true          # lab simplicity; do not expose this port externally
      - "OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-1g} -Xmx${OPENSEARCH_HEAP:-1g}"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks: [threadline]
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  graylog:
    image: graylog/graylog:6.1
    container_name: soc-graylog
    restart: unless-stopped
    depends_on:
      - mongodb
      - opensearch
    environment:
      - GRAYLOG_PASSWORD_SECRET=${GRAYLOG_PASSWORD_SECRET}
      - GRAYLOG_ROOT_PASSWORD_SHA2=${GRAYLOG_ROOT_PASSWORD_SHA2}
      - GRAYLOG_HTTP_EXTERNAL_URI=${GRAYLOG_HTTP_EXTERNAL_URI:-http://localhost:9000/}
      - GRAYLOG_ELASTICSEARCH_HOSTS=http://opensearch:9200
      - GRAYLOG_MONGODB_URI=mongodb://mongodb:27017/graylog
    entrypoint: /usr/bin/tini -- wait-for-it opensearch:9200 -- /docker-entrypoint.sh
    ports:
      - "9000:9000/tcp"      # Web UI + REST API
      - "12201:12201/udp"    # GELF UDP input (Vector ships here)
      - "12201:12201/tcp"    # GELF TCP input (fallback)
      - "1514:1514/udp"      # Raw syslog UDP, for devices that can't run Vector
    networks: [threadline]
    volumes:
      - graylog_data:/usr/share/graylog/data/data
      - graylog_journal:/usr/share/graylog/data/journal

networks:
  threadline:
    driver: bridge

volumes:
  mongodb_data:
  opensearch_data:
  graylog_data:
  graylog_journal:
